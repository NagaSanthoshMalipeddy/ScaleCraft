<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Scalecraft — learn system design through animated, step-by-step isometric diagrams." />
    <title>Scalecraft · System design, animated</title>
    <script>
      try {
        var t = localStorage.getItem('scalecraft.theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        // Animation is the core of each lesson, so it's on unless the user turns it off in the header.
        // (Remote desktop / dev-box sessions often report prefers-reduced-motion even when nobody asked for it.)
        document.documentElement.dataset.motion = localStorage.getItem('scalecraft.motion') || 'full';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
